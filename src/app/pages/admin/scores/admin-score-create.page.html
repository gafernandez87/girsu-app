<section class="admin-entity">
  <section class="admin-hero" aria-labelledby="create-score-title">
    <div>
      <span class="label">Puntos</span>
      <h1 id="create-score-title">Crear puntaje</h1>
    </div>

    <a class="admin-secondary-action" routerLink="/admin/puntos">Volver al listado</a>
  </section>

  @if (error(); as message) {
    <p class="admin-message">{{ message }}</p>
  }

  @if (loading()) {
    <p class="admin-message admin-message--success">Cargando usuarios...</p>
  } @else {
    <form class="entity-form" (ngSubmit)="submit()" #scoreForm="ngForm">
      <div class="form-grid">
        <label class="field">
          Usuario
          <select name="userId" required [(ngModel)]="userId">
            @for (user of users(); track user.id) {
              <option [value]="user.id">{{ user.name }} - {{ user.email }}</option>
            }
          </select>
        </label>

        <label class="field">
          Juego
          <select name="stageId" required [(ngModel)]="stageId">
            @for (stage of stages; track stage.id) {
              <option [value]="stage.id">{{ stage.title }}</option>
            }
          </select>
        </label>

        <label class="field">
          Puntos
          <input type="number" name="score" required min="0" max="1000" [(ngModel)]="score" />
        </label>

        <label class="field">
          Fecha
          <input type="datetime-local" name="completedAt" required [(ngModel)]="completedAt" />
        </label>

        <label class="field">
          Correctas
          <input type="number" name="correct" required min="0" [(ngModel)]="correct" />
        </label>

        <label class="field">
          Errores
          <input type="number" name="mistakes" required min="0" [(ngModel)]="mistakes" />
        </label>

        <label class="field">
          Segundos restantes
          <input type="number" name="remainingSeconds" required min="0" [(ngModel)]="remainingSeconds" />
        </label>
      </div>

      <div class="form-actions">
        <span></span>
        <div class="form-actions__primary">
          <a class="admin-secondary-action" routerLink="/admin/puntos">Cancelar</a>
          <button class="admin-primary-action" type="submit" [disabled]="scoreForm.invalid || saving()">
            {{ saving() ? 'Creando...' : 'Crear puntaje' }}
          </button>
        </div>
      </div>
    </form>
  }
</section>
