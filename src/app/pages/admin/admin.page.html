<main class="admin-page">
  <aside class="admin-sidebar" aria-label="Backoffice">
    <div class="admin-sidebar__brand">
      <span class="label">Backoffice</span>
      <strong>Panel GIRSU</strong>
    </div>

    <nav class="admin-sidebar__nav" aria-label="Secciones del backoffice">
      <a
        routerLink="/admin/users"
        routerLinkActive="is-active"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </span>
        <span>Usuarios</span>
        <strong>{{ stats().total }}</strong>
      </a>

      <a routerLink="/admin/ranking" routerLinkActive="is-active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 21h8" />
            <path d="M12 17v4" />
            <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
            <path d="M5 5H3v3a4 4 0 0 0 4 4" />
            <path d="M19 5h2v3a4 4 0 0 1-4 4" />
          </svg>
        </span>
        <span>Ranking</span>
        <strong>{{ rankingCount() }}</strong>
      </a>

      <a routerLink="/admin/puntos" routerLinkActive="is-active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2v20" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" />
          </svg>
        </span>
        <span>Puntos</span>
        <strong>{{ scoreCount() }}</strong>
      </a>
    </nav>

    <button class="admin-sidebar__refresh" type="button" (click)="reloadSummary()" [disabled]="loading()">
      {{ loading() ? 'Actualizando...' : 'Actualizar datos' }}
    </button>
  </aside>

  <section class="admin-content">
    <router-outlet />
  </section>
</main>
