<div class="app-shell" [class.game-mode]="router.url.startsWith('/juego')">
  @if (!router.url.startsWith('/juego')) {
    <header class="top-bar">
      <a class="brand" routerLink="/" aria-label="Inicio">
        <span class="brand-mark" aria-hidden="true">
          <img src="/assets/brand/girsu-jujuy-logo.svg" alt="" />
        </span>
        <span>
          <strong>Jujuy GIRSU</strong>
          <small>El Camino de los Residuos</small>
        </span>
      </a>

      <nav class="top-nav" aria-label="Principal">
        @if (auth.isAuthenticated()) {
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Inicio
          </a>
          <a routerLink="/ranking" routerLinkActive="active">Ranking</a>
          @if (auth.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="active">Admin</a>
          }
          <button type="button" (click)="signOut()">Salir</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active">Ingresar</a>
          <a routerLink="/registro" routerLinkActive="active">Registro</a>
        }
      </nav>
    </header>
  }

  <router-outlet />
</div>
